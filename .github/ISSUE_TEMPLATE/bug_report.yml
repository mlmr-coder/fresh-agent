name: 缺陷报告
description: 报告Lingo中可以稳定复现的问题
title: "[缺陷] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进Lingo。提交前请删除凭据、私人数据、账号标识和内部地址。
        安全漏洞请使用私密安全报告入口，不要在这里公开。
  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: 出现问题的发布版本或 Git 提交。
      placeholder: "0.9.5 或 abc1234"
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: 操作系统
      options:
        - Linux x86_64
        - Linux ARM64
        - Windows x86_64
        - macOS Apple Silicon
        - macOS Intel
        - 其他
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？你期望的结果是什么？
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请提供可以稳定复现问题的最短步骤。
      placeholder: |
        1. 启动Lingo……
        2. 打开……
        3. 执行……
        4. 观察到……
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志或截图
      description: 只提供相关信息，并删除密钥和私人数据。
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，没有发现相同问题。
          required: true
        - label: 此报告不包含尚未修复的安全漏洞。
          required: true
