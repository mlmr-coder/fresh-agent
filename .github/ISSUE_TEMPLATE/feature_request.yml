name: 功能建议
description: 提议一项明确的鲜小助改进
title: "[建议] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 需要解决什么问题？请先描述需求和使用场景。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望结果
      description: 完成后应该呈现什么行为？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方法
      description: 如有，请说明当前采用的绕行方法或其他方案。
  - type: dropdown
    id: area
    attributes:
      label: 功能范围
      options:
        - 桌面界面
        - Agent 或工作流
        - MCP 或连接器
        - 知识库与产物
        - CodeWhale 引擎
        - 构建与平台支持
        - 文档
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue 和讨论，没有发现相同建议。
          required: true
        - label: 该建议适用于开源社区版本或具有通用价值。
          required: true
